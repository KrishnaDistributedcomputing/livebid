services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livebid}
      POSTGRES_USER: ${POSTGRES_USER:-livebid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livebid-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livebid} -d ${POSTGRES_DB:-livebid}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  livebid:
    build:
      context: .
      dockerfile: Dockerfile
    image: livebid-web:local
    ports:
      - "${LIVEBID_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-livebid}:${POSTGRES_PASSWORD:-livebid-local-password}@postgres:5432/${POSTGRES_DB:-livebid}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-livebid_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: livebid-web:local
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/worker.mjs"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-livebid}:${POSTGRES_PASSWORD:-livebid-local-password}@postgres:5432/${POSTGRES_DB:-livebid}
      REDIS_URL: redis://redis:6379
    depends_on:
      livebid:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
